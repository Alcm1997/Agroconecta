<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; padding: 50px; background: #fff; }
        .arch-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .layer { width: 500px; padding: 25px; border-radius: 12px; text-align: center; font-weight: bold; position: relative; border: 2px solid #2c3e50; }
        .frontend { background-color: #e8f4fd; border-color: #3498db; color: #2980b9; }
        .backend { background-color: #fef5e7; border-color: #f39c12; color: #d35400; }
        .database { background-color: #eafaf1; border-color: #27ae60; color: #1e8449; }
        .arrow { font-size: 30px; color: #7f8c8d; }
        .sub-text { display: block; font-weight: normal; font-size: 0.85em; margin-top: 8px; color: #34495e; }
        .tag { position: absolute; left: -100px; top: 35%; font-size: 0.8em; color: #95a5a6; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="arch-container">
        <div class="layer frontend">
            <span class="tag">Cliente</span>
            CAPA DE PRESENTACIÓN (UI/UX)
            <span class="sub-text">HTML5 | CSS3 | Bootstrap 5 | JavaScript ES6</span>
        </div>
        <div class="arrow">⇅ (Peticiones HTTP / REST)</div>
        <div class="layer backend">
            <span class="tag">Servidor</span>
            CAPA DE APLICACIÓN (Lógica de Negocio)
            <span class="sub-text">Node.js | Express.js | JWT | MVC Controllers</span>
        </div>
        <div class="arrow">⇅ (Consultas SQL)</div>
        <div class="layer database">
            <span class="tag">Datos</span>
            CAPA DE ACCESO A DATOS (Persistencia)
            <span class="sub-text">PostgreSQL | 20+ Tablas Relacionales</span>
        </div>
    </div>
</body>
</html>
