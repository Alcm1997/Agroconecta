<!-- Fragmento de Verificar Código -->
<link rel="stylesheet" href="/css/cliente/pages/verificar.css">

<div class="container">
    <div class="verificar-card">
        <div class="step-indicator">
            <div class="step completed">1</div>
            <div class="step-line completed"></div>
            <div class="step active">2</div>
            <div class="step-line pending"></div>
            <div class="step pending">3</div>
        </div>

        <div class="text-center mb-4">
            <h2 class="verificar-title">Verificar Código</h2>
            <i class="fas fa-envelope-open icono-secondary mb-3"></i>
        </div>

        <div class="email-enviado">
            <p class="email-texto">Código enviado a:</p>
            <p class="email-texto" id="emailDestino">correo@ejemplo.com</p>
        </div>

        <div class="timer-container">
            <p class="timer-text">
                <i class="fas fa-clock me-2"></i>
                El código expira en: <span id="timerDisplay">10:00</span>
            </p>
        </div>

        <form id="verificarForm">
            <div class="mb-3">
                <label for="codigo" class="form-label">Código de Verificación (6 dígitos)</label>
                <input type="text"
                       class="form-control codigo-input"
                       id="codigo"
                       name="codigo"
                       placeholder="000000"
                       maxlength="6"
                       pattern="[0-9]{6}"
                       required>
                <div class="invalid-feedback">
                    Por favor ingresa el código de 6 dígitos.
                </div>
            </div>

            <div class="mb-3">
                <label for="nuevaContrasena" class="form-label">Nueva Contraseña</label>
                <div class="password-input-container">
                    <input type="password"
                           class="form-control"
                           id="nuevaContrasena"
                           name="nuevaContrasena"
                           placeholder="Crea una contraseña segura"
                           minlength="8"
                           maxlength="15"
                           required>
                    <span class="password-toggle" onclick="togglePassword('nuevaContrasena')">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div class="password-strength-meter mt-1">
                    <div class="meter-bar-container">
                        <div class="meter-bar" id="meterBar"></div>
                    </div>
                    <small class="meter-text" id="meterText">
                        Fortaleza: <span class="fw-bold">Esperando...</span>
                    </small>
                </div>
            </div>

            <div class="mb-4">
                <label for="confirmarContrasena" class="form-label">Confirmar Nueva Contraseña</label>
                <div class="password-input-container">
                    <input type="password"
                           class="form-control"
                           id="confirmarContrasena"
                           name="confirmarContrasena"
                           placeholder="Confirma tu contraseña"
                           minlength="8"
                           maxlength="15"
                           required>
                    <span class="password-toggle" onclick="togglePassword('confirmarContrasena')">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn-verificar" id="verificarBtn">
                <i class="fas fa-check me-2"></i>Cambiar Contraseña
            </button>
        </form>

        <div class="text-center">
            <button type="button" class="btn-reenviar" id="reenviarBtn" onclick="reenviarCodigo()">
                <i class="fas fa-redo me-2"></i>Reenviar Código
            </button>
            <button type="button" class="btn-volver" onclick="window.history.back()">
                <i class="fas fa-arrow-left me-2"></i>Volver
            </button>
        </div>
    </div>
</div>

<script src="/javascript/verificarCodigo.js"></script>
