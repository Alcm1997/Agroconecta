<div class="checkout-wrapper bg-light py-4">
  <div class="container-fluid">
    <div class="checkout-container">
      <div class="row g-4">
        <!-- Carrito -->
        <div class="col-lg-8">
          <div class="card card-checkout">
            <div class="card-header">
              <h5 class="mb-0"><i class="fas fa-shopping-cart me-2"></i>Carrito de Compras</h5>
            </div>
            <div class="card-body">
              <div id="emptyCart" class="text-center py-5" style="display:none;">
                <i class="fas fa-shopping-cart fa-3x text-muted mb-3"></i>
                <h5 class="text-muted">Tu carrito está vacío</h5>
                <a href="/" class="btn btn-primary mt-3" onclick="event.preventDefault(); window.navigateTo('/')">
                  <i class="fas fa-store me-2"></i>Ir a la tienda
                </a>
              </div>

              <div class="table-responsive">
                <table class="table table-borderless ">
                  <thead>
                    <tr>
                      <th style="width: 80px;"></th> <!-- Columna para Imagen -->
                      <th>Producto</th>
                      <th class="text-center">P. Unit.</th>
                      <th class="text-center">Cantidad</th>
                      <th class="text-end">Total</th>
                      <th class="text-center">Acción</th>
                    </tr>
                  </thead>
                  <tbody id="cartItems"></tbody>
                </table>
              </div>

              <!-- Botón Seguir Comprando -->
              <div class="mt-3">
                <a href="/" class="btn btn-outline-secondary" onclick="event.preventDefault(); window.navigateTo('/')">
                  <i class="fas fa-arrow-left me-2"></i>Seguir Comprando
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- Resumen -->
        <div class="col-lg-4">
          <div class="card card-checkout sticky-top">
            <div class="card-header">
              <h5 class="mb-0"><i class="fas fa-file-invoice me-2"></i>Resumen</h5>
            </div>
            <div class="card-body">
              <div class="d-flex justify-content-between mb-2">
                <span>Subtotal</span>
                <span id="subtotalAmount">S/ 0.00</span>
              </div>
              <div class="d-flex justify-content-between mb-3">
                <span>IGV (18%)</span>
                <span id="igvAmount">S/ 0.00</span>
              </div>
              <hr>
              <div class="d-flex justify-content-between mb-4">
                <strong>Total</strong>
                <strong class="text-primary" id="totalAmount">S/ 0.00</strong>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold"><i class="fas fa-credit-card me-2"></i>Método de pago</label>
                <div class="dropdown w-100" id="paymentContainer">
                  <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start d-flex justify-content-between align-items-center" type="button" id="paymentDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="border-color: #dee2e6; background: #fff;">
                    <span id="selectedPaymentText">Seleccione método de pago...</span>
                  </button>
                  <ul class="dropdown-menu w-100 shadow-sm" id="paymentOptions" style="max-height: 250px; overflow-y: auto;">
                    <!-- Se carga vía JS -->
                  </ul>
                  <input type="hidden" id="tipoPago" value="">
                </div>
              </div>

              <!-- Formulario Dinámico de Pago -->
              <div id="paymentFormContainer" class="mb-3 animate__animated animate__fadeIn" style="display: none;">
                <!-- Formulario Tarjeta -->
                <div id="formTarjeta" class="payment-details-box p-3 border rounded-3 bg-light" style="display: none;">
                  <h6 class="mb-3"><i class="fas fa-credit-card me-2"></i>Datos de Tarjeta</h6>
                  <div class="mb-2 position-relative">
                    <input type="text" class="form-control pe-5" id="cardNum" placeholder="0000 0000 0000 0000" maxlength="19" autocomplete="cc-number">
                    <div id="cardBrandIcon" class="position-absolute top-50 end-0 translate-middle-y me-3 text-muted" style="font-size: 1.2rem;">
                      <i class="fas fa-credit-card"></i>
                    </div>
                  </div>
                  <div class="row g-2">
                    <div class="col-7">
                      <input type="text" class="form-control" id="cardExp" placeholder="MM/AA" maxlength="5" autocomplete="cc-exp">
                    </div>
                    <div class="col-5">
                      <input type="text" class="form-control" id="cardCvv" placeholder="CVV" maxlength="3" autocomplete="cc-csc" inputmode="numeric" pattern="[0-9]*">
                    </div>
                  </div>
                </div>

                <!-- Formulario Yape -->
                <div id="formYape" class="payment-details-box p-3 border rounded-3 border-purple-light" style="display: none; background-color: #fcf6ff;">
                  <h6 class="text-purple mb-3"><i class="fas fa-mobile-alt me-2"></i>Pago con Yape</h6>
                  <div class="mb-2">
                    <label class="small text-muted">Número de celular</label>
                    <input type="text" class="form-control border-purple" id="yapePhone" placeholder="9XX XXX XXX" maxlength="11">
                  </div>
                  <div class="mb-0">
                    <label class="small text-muted">Código de aprobación</label>
                    <input type="text" class="form-control border-purple" id="yapeCode" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]*">
                  </div>
                </div>

                <!-- Formulario Plin -->
                <div id="formPlin" class="payment-details-box p-3 border rounded-3 border-teal-light" style="display: none; background-color: #f4fdfc;">
                  <h6 class="text-teal mb-3"><i class="fas fa-mobile-alt me-2"></i>Pago con Plin</h6>
                  <div class="mb-2">
                    <label class="small text-muted">Número de celular</label>
                    <input type="text" class="form-control border-teal" id="plinPhone" placeholder="9XX XXX XXX" maxlength="11">
                  </div>
                  <div class="mb-0">
                    <label class="small text-muted">Código de verificación</label>
                    <input type="text" class="form-control border-teal" id="plinCode" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]*">
                  </div>
                </div>
              </div>

              <button id="btnPedir" class="btn btn-checkout w-100">
                <i class="fas fa-file-invoice me-2"></i> REALIZAR PEDIDO
              </button>

              <div id="msg" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

  <script src="/javascript/tienda/payment-formatter.js"></script>
  <script src="/javascript/tienda/checkout.js"></script>
