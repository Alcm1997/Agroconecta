<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitahaya Perú - Registro</title>
    <link rel="icon" type="image/png" href="/icono/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icono/favicon.svg" />
    <link rel="shortcut icon" href="/icono/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icono/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyAgroiOS" />
    <link rel="manifest" href="/site.webmanifest" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/cliente/theme.css">
    <link rel="stylesheet" href="/css/cliente/components.css">
    <link rel="stylesheet" href="/css/cliente/pages/registro.css">
</head>
<body class="auth-bg">

    <!-- Navbar idéntico al del login -->
    <nav class="navbar-auth">
        <a href="/" class="navbar-auth-brand">
            <img src="/imagenes_pitahaya/pitahaya.png" alt="Logo Pitahaya Perú">
            Pitahaya Perú
        </a>
        <a href="/" class="navbar-auth-back">
            <i class="fas fa-arrow-left"></i> Volver a la tienda
        </a>
    </nav>
    
    <!-- Espaciador físico para que nada se meta debajo del navbar fixed -->
    <div class="navbar-spacer"></div>
    <div class="registro-wrapper">
        <div class="registro-card">
            <div class="row align-items-center">
                <!-- Columna Formulario -->
                <div class="col-lg-8 col-md-12">
                    <h2 class="registro-title"><i class="fas fa-user-plus me-2"></i>Registro de Cliente</h2>
                    <form id="registroForm">
                        <div class="row">
                            <!-- Columna 1 del Formulario -->
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="tipo_cliente" class="form-label">Tipo de Cliente</label>
                                    <select class="form-select" id="tipo_cliente" name="tipo_cliente" required>
                                        <option value="Natural" selected>Natural</option>
                                        <option value="Jurídica">Jurídica</option>
                                    </select>
                                </div>
                                <div id="campos_natural">
                                    <div class="mb-3">
                                        <label for="nombres" class="form-label">Nombres</label>
                                        <input type="text" class="form-control" id="nombres" name="nombres" placeholder="Juan">
                                    </div>
                                    <div class="mb-3">
                                        <label for="apellidos" class="form-label">Apellidos</label>
                                        <input type="text" class="form-control" id="apellidos" name="apellidos" placeholder="Pérez">
                                    </div>
                                    <div class="mb-3">
                                        <label for="dni" class="form-label">DNI</label>
                                        <input type="text" class="form-control" id="dni" name="dni" maxlength="8">
                                    </div>
                                </div>
                                <div id="campos_juridica" style="display:none;">
                                    <div class="mb-3">
                                        <label for="razon_social" class="form-label">Razón Social</label>
                                        <input type="text" class="form-control" id="razon_social" name="razon_social">
                                    </div>
                                    <div class="mb-3">
                                        <label for="ruc" class="form-label">RUC</label>
                                        <input type="text" class="form-control" id="ruc" name="ruc" maxlength="11">
                                    </div>
                                </div>
                            </div>

                            <!-- Columna 2 del Formulario -->
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="telefono" class="form-label">Teléfono</label>
                                    <input type="text" class="form-control" id="telefono" name="telefono" required>
                                </div>
                                <div class="mb-3">
                                    <label for="direccion" class="form-label">Dirección</label>
                                    <input type="text" class="form-control" id="direccion" name="direccion" required>
                                </div>
                                <div class="mb-3">
                                    <label for="id_distrito" class="form-label">Departamento - Distrito</label>
                                    <select class="form-select" id="id_distrito" name="id_distrito" required>
                                        <option value="">Seleccione un distrito</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="col-md-6 mb-3 position-relative">
                                <label for="contrasena" class="form-label">Contraseña</label>
                                <div class="password-input-container">
                                    <input type="password" class="form-control pe-5" id="contrasena" name="contrasena" required autocomplete="new-password" minlength="8" maxlength="15">
                                    <span onclick="togglePassword()" class="password-toggle">
                                        <i class="fa-solid fa-eye-slash" id="iconoPassword"></i>
                                    </span>
                                </div>
                                <!-- Medidor de fortaleza -->
                                <div class="password-strength-meter mt-1">
                                    <div class="meter-bar-container">
                                        <div class="meter-bar" id="meterBar"></div>
                                    </div>
                                    <small class="meter-text" id="meterText">
                                        Fortaleza: <span class="fw-bold">Esperando...</span>
                                    </small>
                                </div>
                            </div>
                        </div>

                        <div class="row mt-4">
                            <div class="col-md-6 mb-2">
                                <button type="button" class="btn-cancelar w-100" onclick="window.history.back()">
                                    <i class="fas fa-times me-2"></i> Cancelar
                                </button>
                            </div>
                            <div class="col-md-6">
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-user-check me-2"></i> Registrarse
                                </button>
                            </div>
                        </div>
                    </form>
                    <div class="text-center mt-3">
                        <span class="text-muted">¿Ya tienes cuenta?</span>
                        <a href="/login" class="auth-link">Inicia Sesión</a>
                    </div>
                </div>

                <!-- Columna Imagen Decorativa -->
                <div class="col-lg-4 d-none d-lg-block text-center">
                    <img src="/imagenes_pitahaya/pitahaya.png" alt="Decoración" class="img-circular-bg">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.24/dist/sweetalert2.all.min.js"></script>
    <script src="/javascript/registroCliente.js"></script>
</body>
</html>
