<!-- Fragmento de Inicio de Sesión -->
<link rel="stylesheet" href="/css/cliente/pages/login.css">

<div class="login-card">
    <div class="text-center mb-3">
        <img src="/imagenes_pitahaya/pitahaya.png" alt="Logo Pitahaya Perú" class="img-fluid login-logo">
    </div>
    <h2 class="login-title"><i class="fas fa-leaf me-2"></i>Pitahaya Perú</h2>
    <form id="loginForm">
        <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" name="email" required placeholder="example@hotmail.com" autocomplete="email" maxlength="50">
        </div>
        <div class="mb-3">
            <label for="contrasena" class="form-label">Contraseña</label>
            <div class="password-input-container">
                <input type="password" class="form-control pe-5" id="contrasena" name="contrasena" required autocomplete="current-password" minlength="8" maxlength="15">
                <span onclick="togglePassword()" class="password-toggle">
                    <i class="fa-solid fa-eye-slash" id="iconoPassword"></i>
                </span>
            </div>
        </div>
        <div id="loginError" class="text-danger small mb-2"></div>
        <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
        <div class="text-center mt-3">
            <a href="/recuperar-contrasena" class="auth-link">¿Olvidaste tu contraseña?</a>
        </div>
    </form>
    <div class="text-center mt-3">
        <span class="text-muted">¿No tienes cuenta?</span>
        <a href="/registro" class="auth-link">Regístrate</a>
    </div>
</div>

<script src="/javascript/loginCliente.js"></script>
