<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitahaya Perú - Iniciar Sesión</title>
    <link rel="icon" type="image/png" href="/icono/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icono/favicon.svg" />
    <link rel="shortcut icon" href="/icono/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icono/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyAgroiOS" />
    <link rel="manifest" href="/site.webmanifest" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Capa 1: tokens y variables globales -->
    <link rel="stylesheet" href="/css/cliente/theme.css">
    <!-- Capa 2: componentes reutilizables (incluye .navbar-auth, .auth-bg, .login-card, etc.) -->
    <link rel="stylesheet" href="/css/cliente/components.css">
    <!-- Capa 3: estilos exclusivos de esta página -->
    <link rel="stylesheet" href="/css/cliente/pages/login.css">
</head>
<body class="auth-bg">

    <!-- Navbar simplificado: solo logo + volver a la tienda (sin botones de sesión/carrito) -->
    <nav class="navbar-auth">
        <a href="/" class="navbar-auth-brand">
            <img src="/imagenes_pitahaya/pitahaya.png" alt="Logo Pitahaya Perú">
            Pitahaya Perú
        </a>
        <a href="/" class="navbar-auth-back">
            <i class="fas fa-arrow-left"></i> Volver a la tienda
        </a>
    </nav>

    <div class="login-card">
        <div class="text-center mb-3">
            <img src="/imagenes_pitahaya/pitahaya.png" alt="Logo Pitahaya Perú" class="img-fluid login-logo">
        </div>
        <h2 class="login-title"><i class="fas fa-leaf me-2"></i>Pitahaya Perú</h2>
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="example@hotmail.com" autocomplete="email">
            </div>
            <div class="mb-3">
                <label for="contrasena" class="form-label">Contraseña</label>
                <div class="password-input-container">
                    <input type="password" class="form-control pe-5" id="contrasena" name="contrasena" required autocomplete="current-password" minlength="8" maxlength="15">
                    <span onclick="togglePassword()" class="password-toggle">
                        <i class="fa-solid fa-eye-slash" id="iconoPassword"></i>
                    </span>
                </div>
            </div>
            <div id="loginError" class="text-danger small mb-2"></div>
            <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
            <div class="text-center mt-3">
                <a href="/recuperar-contrasena" class="auth-link">¿Olvidaste tu contraseña?</a>
            </div>
        </form>
        <div class="text-center mt-3">
            <span class="text-muted">¿No tienes cuenta?</span>
            <a href="/registro" class="auth-link">Regístrate</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.24/dist/sweetalert2.all.min.js"></script>
    <script src="/javascript/loginCliente.js"></script>
</body>
</html>
