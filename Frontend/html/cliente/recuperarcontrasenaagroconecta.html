<!-- Fragmento de Recuperar Contraseña -->
<link rel="stylesheet" href="/css/cliente/pages/recuperar.css">

<div class="recuperar-card">
    <div class="text-center mb-4">
        <h2 class="recuperar-title">¿Olvidaste tu contraseña?</h2>
        <div class="icono-container">
            <i class="fas fa-lock icono-secondary"></i>
        </div>
    </div>

    <h6 class="subtitle">Recuperar cuenta</h6>
    <p class="descripcion">Ingresa tu correo para buscar tu cuenta de AgroConecta.</p>

    <form id="recuperarForm">
        <div class="mb-3">
            <label for="email" class="form-label">Correo*</label>
            <input type="email"
                   class="form-control"
                   id="email"
                   name="email"
                   placeholder="example@hotmail.com"
                   required>
            <div class="invalid-feedback">
                Por favor ingresa un correo electrónico válido.
            </div>
        </div>

        <button type="submit" class="btn-buscar" id="buscarBtn">
            <i class="fas fa-search me-2"></i>Buscar cuenta
        </button>
    </form>

    <div class="text-center mt-3">
        <button type="button" class="btn-iniciar" onclick="window.navigateTo('/login')">
            <i class="fas fa-arrow-left me-2"></i>Inicia sesión
        </button>
    </div>
</div>

<script src="/javascript/recuperarContrasena.js"></script>
