<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0" style="color: #2E7D32; font-weight: 600;">
        <i class="fas fa-cog me-2"></i>Configuración del Sistema
    </h2>
</div>

<div class="row">
    <!-- Categorías -->
    <div class="col-md-6 mb-4">
        <div class="config-card" onclick="panelControl.loadConfigSubSection('categorias')">
            <div class="config-icon bg-primary">
                <i class="fas fa-tags"></i>
            </div>
            <h5>Categorías</h5>
            <p>Gestiona las categorías de productos del sistema</p>
            <div class="config-arrow">
                <i class="fas fa-arrow-right"></i>
            </div>
        </div>
    </div>

    <!-- Unidades de Medida -->
    <div class="col-md-6 mb-4">
        <div class="config-card" onclick="panelControl.loadConfigSubSection('unidades-medida')">
            <div class="config-icon bg-success">
                <i class="fas fa-ruler"></i>
            </div>
            <h5>Unidades de Medida</h5>
            <p>Define las unidades de medida para los productos</p>
            <div class="config-arrow">
                <i class="fas fa-arrow-right"></i>
            </div>
        </div>
    </div>
