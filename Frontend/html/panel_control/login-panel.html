<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Pitahaya Perú</title>
    <link rel="icon" type="image/png" href="/icono/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icono/favicon.svg" />
    <link rel="shortcut icon" href="/icono/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icono/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyAgroiOS" />
    <link rel="manifest" href="/site.webmanifest" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Archivos CSS Centralizados del Panel -->
    <link rel="stylesheet" href="/css/panel/theme-panel.css">
    <link rel="stylesheet" href="/css/panel/components-panel.css">
    <link rel="stylesheet" href="/css/panel/pages/login.css">
</head>

<body class="auth-bg-panel">
    <div class="login-card-panel">
        <div class="text-center mb-3">
            <img src="/imagenes_pitahaya/pitahaya.png" alt="Logo Pitahaya Perú" class="img-fluid"
                style="width:110px; height:110px; border-radius:50%; object-fit:cover; box-shadow:0 2px 12px rgba(0,0,0,0.10); border:4px solid #fff;">
        </div>

        <h2 class="login-title">
            <i class="fas fa-user-shield me-2"></i>Panel de Control
        </h2>

        <form id="loginPanelForm">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required
                    placeholder="Ingresa tu usuario" autocomplete="username">
            </div>

            <div class="mb-3 position-relative">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control pe-5" id="password" name="password" required
                    autocomplete="current-password" maxlength="15">
                <span onclick="togglePassword()"
                    style="position:absolute; top:72.5%; right:18px; transform:translateY(-50%); cursor:pointer; color:#666; font-size: 1.3em;">
                    <i class="fa-solid fa-eye-slash" id="iconoPassword"></i>
                </span>
            </div>
            <div id="loginError" class="error-message">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span id="errorText"></span>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i>
                </div>
                <span id="loginBtnText">Ingresar al Panel</span>
            </button>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.24/dist/sweetalert2.all.min.js"></script>

    <script src="/javascript/panel_control/login.js" defer></script>
</body>

</html>
