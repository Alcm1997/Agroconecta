<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control</title>
    <link rel="icon" type="image/png" href="/icono/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icono/favicon.svg" />
    <link rel="shortcut icon" href="/icono/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icono/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyAgroiOS" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <!-- Chart.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.css">
    <!-- Archivos CSS Centralizados del Panel -->
    <link rel="stylesheet" href="/css/panel/theme-panel.css">
    <link rel="stylesheet" href="/css/panel/components-panel.css">
</head>

<body>
    <!-- ✅ SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="../../imagenes_pitahaya/pitahaya.png" alt="Logo" class="company-logo">
            <h4>Pitahaya Perú</h4>
            <small style="color: rgba(255,255,255,0.7);">Panel de Control</small>
        </div>

        <nav class="sidebar-nav">
            <!-- ✅ MENÚ PRINCIPAL -->
            <div class="nav-item">
                <a href="#" class="nav-link active" data-section="menu">
                    <i class="fas fa-tachometer-alt"></i>
                    Menú
                </a>
            </div>

            <!-- ✅ PRODUCTOS -->
            <div class="nav-item">
                <a href="#" class="nav-link" data-section="productos">
                    <i class="fas fa-box"></i>
                    Productos
                </a>
            </div>

            <!-- ✅ CLIENTES -->
            <div class="nav-item">
                <a href="#" class="nav-link" data-section="clientes">
                    <i class="fas fa-users"></i>
                    Clientes
                </a>
            </div>

            <!-- ✅ PEDIDOS -->
            <div class="nav-item">
                <a href="#" class="nav-link" data-section="pedidos">
                    <i class="fas fa-shopping-cart"></i>
                    Pedidos
                </a>
            </div>

            <!-- ✅ REPORTES -->
            <div class="nav-item">
                <a href="#" class="nav-link" data-section="reportes">
                    <i class="fas fa-chart-line"></i>
                    Reportes
                </a>
            </div>

            <!-- ✅ USUARIOS -->
            <div class="nav-item">
                <a href="#" class="nav-link" data-section="usuarios">
                    <i class="fas fa-user-shield"></i>
                    Usuarios
                </a>
            </div>

            <!-- ✅ CONFIGURACIÓN (AHORA INCLUYE CATEGORÍAS Y UNIDADES) -->
            <div class="nav-item">
                <a href="#" class="nav-link" data-section="configuracion">
                    <i class="fas fa-cog"></i>
                    Configuración
                </a>
            </div>

            <!-- ✅ ASESORÍAS -->
            <div class="nav-item">
                <a href="#" class="nav-link" data-section="asesorias">
                    <i class="fas fa-comments"></i>
                    Asesorías
                </a>
            </div>

            <!-- ✅ TRANSPORTE -->
            <div class="nav-item">
                <a href="#" class="nav-link" data-section="transporte">
                    <i class="fas fa-truck"></i>
                    Transporte
                </a>
            </div>

            <!-- ✅ SEPARADOR -->
            <hr style="border-color: rgba(255,255,255,0.1); margin: 1.5rem 1rem;">

            <!-- ✅ IR A LA TIENDA -->
            <div class="nav-item">
                <a href="/" class="nav-link" target="_blank" rel="noopener noreferrer">
                    <i class="fas fa-home"></i>
                    Ir a la Tienda
                </a>
            </div>

            <!-- ✅ CERRAR SESIÓN -->
            <div class="nav-item">
                <a href="#" class="nav-link" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i>
                    Cerrar Sesión
                </a>
            </div>
        </nav>
    </div>

    <!-- ✅ BACKDROP del sidebar para móvil -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ✅ MAIN CONTENT -->
    <div class="main-content">
        <!-- ✅ TOPBAR MEJORADO -->
        <div class="topbar">
            <div class="topbar-left">
                <!-- ✅ BOTÓN HAMBURGUESA PARA MÓVILES -->
                <button class="btn btn-link d-md-none me-3" id="sidebarToggle" style="padding: 0.5rem;">
                    <i class="fas fa-bars"></i>
                </button>
                <div>
                    <!-- ✅ TÍTULO DINÁMICO -->
                    <h1 id="pageTitle">Panel de Control - Bienvenido</h1>
                    <small>Administrador Sistema</small>
                </div>
            </div>

            <!-- ✅ INFORMACIÓN DEL USUARIO -->
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">A</div>
                <div class="user-details">
                    <div class="user-name" id="adminName">Administrador Sistema</div>
                    <div class="user-role">Panel de Control</div>
                </div>
            </div>
        </div>

        <!-- ✅ ÁREA DE CONTENIDO -->
        <div class="content-area">
            <!-- ✅ LOADING -->
            <div class="loading" id="loading">
                <i class="fas fa-spinner"></i>
                <p>Cargando...</p>
            </div>

            <!-- ✅ CONTENIDO DINÁMICO -->
            <div id="dynamicContent">
                <!-- El contenido se cargará aquí dinámicamente -->
            </div>
        </div>
    </div>

    <!-- ✅ SCRIPTS -->
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.24/dist/sweetalert2.all.min.js"></script>
    <!-- Panel Control JS -->
    <script src="../../javascript/panel_control/menu.js"></script>
    <script src="/javascript/panel_control/usuario/listar.js"></script>
    <script src="/javascript/panel_control/usuario/actualizar.js"></script>
    <script src="/javascript/panel_control/usuario/registrar.js"></script>
    <script src="/javascript/panel_control/cliente/listar.js"></script>
    <script src="/javascript/panel_control/categoria/listar.js"></script>
    <script src="/javascript/panel_control/producto/listar.js"></script>
    <script src="/javascript/panel_control/producto/registrar.js"></script>
    <script src="/javascript/panel_control/producto/actualizar.js"></script>
    <script src="/javascript/panel_control/asesoria/listar.js"></script>

</body>

</html>
