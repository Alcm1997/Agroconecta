<div class="d-flex justify-content-between align-items-center mb-4 flex-column flex-sm-row gap-2">
    <h2 class="mb-0 align-self-start" style="color: #2E7D32; font-weight: 600;">
        <i class="fas fa-tags me-2"></i>Gestión de Categorías
    </h2>
    <!-- En móvil: fila full-width con botones en cada extremo -->
    <!-- En escritorio: fila auto-width alineada a la derecha -->
    <div class="d-flex justify-content-between gap-2 cat-header-btns">
        <button class="btn btn-outline-secondary btn-sm" onclick="panelControl.loadSection('configuracion')"
            title="Volver a Configuración">
            <i class="fas fa-arrow-left me-1"></i>Configuración
        </button>
        <button class="btn btn-primary btn-sm" onclick="mostrarModalNuevaCategoria()">
            <i class="fas fa-plus me-2"></i>Nueva Categoría
        </button>
    </div>
</div>

<div class="dashboard-card">
    <div class="table-responsive">
        <table class="table table-hover mb-0" id="tablaCategorias">
            <thead class="table-dark">
                <tr>
                    <th style="background: #1E40AF; border-color: #1E3A8A;">ID</th>
                    <th style="background: #1E40AF; border-color: #1E3A8A;">Descripción</th>
                    <th class="text-center" style="background: #1E40AF; border-color: #1E3A8A;">Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Modal Nueva/Editar Categoría -->
<div class="modal fade" id="modalCategoria" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tituloModal">Nueva Categoría</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formCategoria">
                    <input type="hidden" id="categoriaId">
                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción *</label>
                        <input type="text" class="form-control" id="descripcion" required maxlength="50">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="guardarCategoria()">Guardar</button>
            </div>
        </div>
    </div>
</div>
