<div class="loading-overlay" id="loadingOverlay" style="display:none;">
    <div class="loading-content">
        <i class="fas fa-spinner loading-spinner"></i>
        <p class="mt-2 mb-0">Preparando formulario...</p>
    </div>
</div>

<div class="page-header">
    <h2 id="pageTitle"><i class="fas fa-user-plus me-2"></i>Registrar Usuario</h2>
    <p>Crea un nuevo usuario del sistema</p>
</div>

<div class="form-card">
    <form id="formRegistrarUsuario" autocomplete="off">
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="nombres" class="form-label">
                        <i class="fas fa-user me-1"></i>Nombres
                    </label>
                    <input type="text" class="form-control" id="nombres" required placeholder="Ingrese los nombres">
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="apellidos" class="form-label">
                        <i class="fas fa-user me-1"></i>Apellidos
                    </label>
                    <input type="text" class="form-control" id="apellidos" required placeholder="Ingrese los apellidos">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope me-1"></i>Email
                    </label>
                    <input type="email" class="form-control" id="email" required placeholder="usuario@ejemplo.com">
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="fas fa-at me-1"></i>Username
                    </label>
                    <input type="text" class="form-control" id="username" required placeholder="nombre_usuario">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock me-1"></i>Contraseña
                    </label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" required placeholder="********">
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="passwordConfirm" class="form-label">
                        <i class="fas fa-lock me-1"></i>Confirmar Contraseña
                    </label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="passwordConfirm" required placeholder="Repita la contraseña">
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="passwordConfirm">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="id_cargo" class="form-label">
                        <i class="fas fa-briefcase me-1"></i>Cargo
                    </label>
                    <select class="form-select" id="id_cargo" required>
                        <option value="">Cargando cargos...</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="d-flex btn-group">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-2"></i>Registrar Usuario
            </button>
            <button type="button" class="btn btn-secondary" id="btnVolverUsuarios">
                <i class="fas fa-arrow-left me-2"></i>Volver a Usuarios
            </button>
        </div>
    </form>
</div>
