<div class="loading-overlay" id="loadingOverlay" style="display: flex;">
    <div class="loading-content">
        <i class="fas fa-spinner loading-spinner"></i>
        <p class="mt-2 mb-0">Cargando información del usuario...</p>
    </div>
</div>

<!-- Header -->
<div class="page-header">
    <h2><i class="fas fa-user-edit me-2"></i>Actualizar Usuario</h2>
    <p>Modifica la información del usuario del sistema</p>
</div>

<!-- Form Card -->
<div class="form-card">
    <form id="formActualizarUsuario">
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="nombres" class="form-label">
                        <i class="fas fa-user me-1"></i>Nombres
                    </label>
                    <input type="text" class="form-control" id="nombres" name="nombres" required placeholder="Ingrese los nombres">
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="apellidos" class="form-label">
                        <i class="fas fa-user me-1"></i>Apellidos
                    </label>
                    <input type="text" class="form-control" id="apellidos" name="apellidos" required placeholder="Ingrese los apellidos">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope me-1"></i>Email
                    </label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="usuario@ejemplo.com">
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="fas fa-at me-1"></i>Username
                    </label>
                    <input type="text" class="form-control" id="username" name="username" required placeholder="nombre_usuario">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="id_cargo" class="form-label">
                        <i class="fas fa-briefcase me-1"></i>Cargo
                    </label>
                    <select class="form-select" id="id_cargo" name="id_cargo" required>
                        <option value="">Seleccionar cargo...</option>
                        <!-- Los cargos se cargarán dinámicamente -->
                    </select>
                </div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="d-flex btn-group">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-2"></i>Actualizar Usuario
            </button>
            <!-- ✅ CORREGIR ESTE BOTÓN -->
            <button type="button" class="btn btn-secondary" id="btnVolverUsuarios">
                <i class="fas fa-arrow-left me-2"></i>Volver a Usuarios
            </button>
        </div>
    </form>
</div>

<!-- Estilos específicos para el formulario -->
