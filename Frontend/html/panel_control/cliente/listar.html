<!-- ✅ FIX MÓVIL: flex-wrap en el header -->

        <i class="fas fa-user-friends me-2"></i>Clientes del Sistema
    </h2>

<!-- Clientes Naturales -->

    <h5 class="mb-3"><i class="fas fa-user me-2 text-success"></i>Clientes Naturales</h5>
    <div class="table-responsive" style="overflow-x:auto; -webkit-overflow-scrolling:touch;">
        <table class="table table-hover mb-0" id="tablaClientesNaturales" style="min-width:580px;">
            <thead class="table-dark">
                <tr>
                    <th style="background:#1E40AF; border-color:#1E3A8A;">Nombres</th>
                    <th style="background:#1E40AF; border-color:#1E3A8A;">Apellidos</th>
                    <th style="background:#1E40AF; border-color:#1E3A8A; white-space:nowrap;">DNI</th>
                    <th style="background:#1E40AF; border-color:#1E3A8A;">Email</th>
                    <th style="background:#1E40AF; border-color:#1E3A8A; white-space:nowrap;">Teléfono</th>
                    <th style="background:#1E40AF; border-color:#1E3A8A; white-space:nowrap;">Estado</th>
                    <th class="text-center" style="background:#1E40AF; border-color:#1E3A8A; white-space:nowrap;">
                        Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Clientes Jurídicos -->
