        <i class="fas fa-boxes me-2"></i>Gestión de Productos
    </h2>

                    <th style="background: #1E40AF; border-color: #1E3A8A; white-space:nowrap;">Precio Base</th>
                    <th class="text-center" style="background: #1E40AF; border-color: #1E3A8A; white-space:nowrap;">

            </tbody>
