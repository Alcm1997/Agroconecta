<!-- ✅ SECCIÓN: GESTIÓN DE PEDIDOS -->

<!-- Título de sección — mismo patrón que Productos, Clientes y Usuarios -->
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="mb-0" style="color: #2E7D32; font-weight: 600;">
        <i class="fas fa-shopping-cart me-2"></i>Gestión de Pedidos
    </h2>
</div>

<div class="dashboard-card" style="overflow:hidden;">
    <!-- Filtros -->
    <div class="row mb-4 g-3">
        <div class="col-md-3 col-sm-6">
            <label for="filtroEstado" class="form-label">Estado</label>
            <select id="filtroEstado" class="form-select">
                <option value="">Todos</option>
                <option value="Pendiente">Pendiente</option>
                <option value="Entregado">Entregado</option>
                <option value="Cancelado">Cancelado</option>
            </select>
        </div>
        <div class="col-md-3 col-sm-6">
            <label for="fechaInicio" class="form-label">Fecha Inicio</label>
            <input type="date" id="fechaInicio" class="form-control">
        </div>
        <div class="col-md-3 col-sm-6">
            <label for="fechaFin" class="form-label">Fecha Fin</label>
            <input type="date" id="fechaFin" class="form-control">
        </div>
        <div class="col-md-3 col-sm-6 d-flex align-items-end gap-2">
            <button id="btnFiltrar" class="btn btn-primary btn-sm">
                <i class="fas fa-filter me-1"></i>Filtrar
            </button>
            <button id="btnLimpiar" class="btn btn-secondary btn-sm">
                <i class="fas fa-times me-1"></i>Limpiar
            </button>
        </div>
    </div>

    <!-- Tabla de pedidos -->
    <div class="table-responsive" style="overflow-x:auto; -webkit-overflow-scrolling:touch;">
        <table class="table table-hover table-striped mb-0" style="min-width:680px;">
            <thead style="background:#1E40AF;">
                <tr>
                    <th style="background:#1E40AF; color:white; border-color:#1E3A8A; white-space:nowrap;">ID</th>
                    <th style="background:#1E40AF; color:white; border-color:#1E3A8A; white-space:nowrap;">Fecha</th>
                    <th style="background:#1E40AF; color:white; border-color:#1E3A8A;">Cliente</th>
                    <th style="background:#1E40AF; color:white; border-color:#1E3A8A;">Email</th>
                    <th style="background:#1E40AF; color:white; border-color:#1E3A8A; white-space:nowrap;">Total</th>
                    <th style="background:#1E40AF; color:white; border-color:#1E3A8A; white-space:nowrap;">Estado</th>
                    <th style="background:#1E40AF; color:white; border-color:#1E3A8A; white-space:nowrap;">Comprobante
                    </th>
                    <th style="background:#1E40AF; color:white; border-color:#1E3A8A; white-space:nowrap;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaPedidos">
                <tr>
                    <td colspan="8" class="text-center py-4">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Paginación -->
    <nav aria-label="Paginación de pedidos" class="mt-3">
        <ul class="pagination justify-content-center" id="paginacion"></ul>
    </nav>
</div>

<!-- Modal para cambiar estado -->
<div class="modal fade" id="modalCambiarEstado" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Cambiar Estado del Pedido</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Pedido ID: <strong id="modalPedidoId"></strong></p>
                <div class="mb-3">
                    <label for="nuevoEstado" class="form-label">Nuevo Estado</label>
                    <select id="nuevoEstado" class="form-select">
                        <option value="Pendiente">Pendiente</option>
                        <option value="Entregado">Entregado</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                </div>
                <div class="alert alert-warning" role="alert">
                    <i class="fas fa-exclamation-triangle me-1"></i>
                    <strong>Nota:</strong> Si cancela un pedido, el stock de los productos se restaurará
                    automáticamente.
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btnConfirmarCambio">Confirmar</button>
            </div>
        </div>
    </div>
</div>
