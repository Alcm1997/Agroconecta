<!-- ✅ SECCIÓN: ASESORÍAS -->

<!-- Título de sección — mismo patrón que Productos, Clientes y Usuarios -->
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="mb-0" style="color: #2E7D32; font-weight: 600;">
        <i class="fas fa-comments me-2"></i>Consultas de Asesoría
    </h2>
</div>

<div class="dashboard-card">
    <div class="d-flex justify-content-end align-items-center mb-4 flex-wrap gap-2">
        <select class="form-select form-select-sm" id="filtroEstado" style="width: auto;">
            <option value="">Todos</option>
            <option value="Pendiente">Pendientes</option>
            <option value="Respondida">Respondidas</option>
            <option value="Cerrada">Cerradas</option>
        </select>
        <button class="btn btn-outline-primary btn-sm" onclick="cargarAsesorias()">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <!-- Stats rápidas -->
    <div class="row mb-4" id="statsAsesorias">
        <div class="col-md-4 col-sm-6 mb-3">
            <div class="border rounded p-3 text-center bg-warning bg-opacity-10">
                <h3 class="mb-0 text-warning" id="statPendientes">0</h3>
                <small class="text-muted">Pendientes</small>
            </div>
        </div>
        <div class="col-md-4 col-sm-6 mb-3">
            <div class="border rounded p-3 text-center bg-success bg-opacity-10">
                <h3 class="mb-0 text-success" id="statRespondidas">0</h3>
                <small class="text-muted">Respondidas</small>
            </div>
        </div>
        <div class="col-md-4 col-sm-6 mb-3">
            <div class="border rounded p-3 text-center bg-secondary bg-opacity-10">
                <h3 class="mb-0 text-secondary" id="statCerradas">0</h3>
                <small class="text-muted">Cerradas</small>
            </div>
        </div>
    </div>

    <!-- Tabla de asesorías -->
    <div class="table-responsive" style="overflow-x:auto; -webkit-overflow-scrolling:touch;">
        <table class="table table-hover mb-0" id="tablaAsesorias" style="min-width:620px;">
            <thead class="table-light">
                <tr>
                    <th style="white-space:nowrap;">ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Mensaje</th>
                    <th style="white-space:nowrap;">Fecha</th>
                    <th style="white-space:nowrap;">Estado</th>
                    <th style="white-space:nowrap;">Acciones</th>
                </tr>
            </thead>
            <tbody id="listaAsesorias">
                <tr>
                    <td colspan="7" class="text-center py-4">
                        <i class="fas fa-spinner fa-spin me-2"></i>Cargando consultas...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Ver Detalle -->
<div class="modal fade" id="modalDetalleAsesoria" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="fas fa-envelope-open me-2"></i>Detalle de Consulta</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="detalleAsesoriaContent">
                <!-- Contenido dinámico -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Responder Asesoría -->
<div class="modal fade" id="modalResponderAsesoria" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="fas fa-paper-plane me-2"></i>Responder Consulta</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formResponderAsesoria">
                    <input type="hidden" id="responderIdConsulta">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Para:</label>
                        <p class="mb-2 fw-bold" id="responderClienteNombre"></p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Mensaje de Respuesta:</label>
                        <textarea class="form-control" id="respuestaTexto" rows="6" required 
                                  placeholder="Escribe aquí tu respuesta para el cliente..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success" id="btnEnviarRespuesta" onclick="enviarRespuesta()">
                    <i class="fas fa-paper-plane me-1"></i>Enviar Correo
                </button>
            </div>
        </div>
    </div>
</div>
