<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Servicio temporalmente no disponible | AgroConecta</title>
    <link rel="icon" type="image/png" href="/icono/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/icono/favicon.ico" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #fdf6f6 0%, #f5e6e6 100%);
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(127, 29, 29, 0.1);
            max-width: 480px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
            border-top: 6px solid #dc3545;
        }
        .code {
            display: inline-block;
            background: #fee2e2;
            color: #991b1b;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 26px;
            color: #7f1d1d;
            margin-bottom: 12px;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 28px;
        }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .btn-primary {
            background: #198754;
            color: #ffffff;
        }
        .btn-primary:hover { background: #157347; transform: translateY(-1px); }
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }
        .btn-secondary:hover { background: #e5e7eb; }
    </style>
</head>
<body>
    <main class="card">
        <span class="code">ERROR DEL SERVIDOR</span>
        <h1>Tuvimos un problema temporal</h1>
        <p>Nuestro servidor está presentando inconvenientes en este momento. Por favor, intenta nuevamente en unos segundos.</p>
        <div class="actions">
            <button type="button" onclick="window.location.reload()" class="btn btn-primary">Reintentar</button>
            <a href="/" class="btn btn-secondary">Ir al inicio</a>
        </div>
    </main>
</body>
</html>
